# The fields planner-web reads from trip patterns returned by atb-bff.
fragment tripPatternWithDetails on TripPattern {
  expectedStartTime
  expectedEndTime
  duration
  walkDistance
  legs {
    ...legWithDetails
  }
}

fragment tripWithDetailsLine on Line {
  name
  publicCode
  notices {
    ...notice
  }
  flexibleLineType
}

fragment legWithDetails on Leg {
  id
  mode
  distance
  transportSubmode
  aimedStartTime
  aimedEndTime
  expectedStartTime
  expectedEndTime
  realtime
  duration
  serviceDate
  rentedBike
  pointsOnLink {
    points
    length
  }
  line {
    ...tripWithDetailsLine
  }
  fromPlace {
    name
    latitude
    longitude
    quay {
      ...quay
    }
  }
  toPlace {
    name
    latitude
    longitude
    quay {
      ...quay
    }
  }
  serviceJourney {
    id
    notices {
      ...notice
    }
    journeyPattern {
      notices {
        ...notice
      }
    }
  }
  fromEstimatedCall {
    stopPositionInPattern
    notices {
      ...notice
    }
    destinationDisplay {
      frontText
      via
    }
    cancellation
    requestStop
  }
  toEstimatedCall {
    stopPositionInPattern
    notices {
      ...notice
    }
    cancellation
    requestStop
  }
  interchangeTo {
    guaranteed
    maximumWaitTime
    staySeated
    fromServiceJourney {
      id
      publicCode
      line {
        publicCode
      }
    }
    toServiceJourney {
      id
      publicCode
      line {
        publicCode
      }
    }
  }
  intermediateEstimatedCalls {
    aimedDepartureTime
    expectedDepartureTime
    realtime
    forBoarding
    forAlighting
    quay {
      name
    }
    notices {
      ...notice
    }
  }
  situations {
    ...situation
  }
  serviceJourneyEstimatedCalls {
    aimedDepartureTime
    expectedDepartureTime
    actualDepartureTime
    cancellation
    quay {
      name
    }
    realtime
  }
  bookingArrangements {
    bookingMethods
    latestBookingTime
    bookingNote
    bookWhen
    latestBookingTime
    minimumBookingPeriod
    bookingContact {
      contactPerson
      email
      url
      phone
      furtherDetails
    }
  }
  authority {
    ...authority
  }
}

fragment authority on Authority {
  id
  name
  url
  fareUrl
}

fragment notice on Notice {
  id
  text
}

fragment quay on Quay {
  publicCode
  name
  description
  id
  stopPlace {
    id
  }
  situations {
    ...situation
  }
  tariffZones {
    id
    name
  }
}
fragment situation on PtSituationElement {
  id
  situationNumber
  summary {
    ...multilingualString
  }
  description {
    ...multilingualString
  }
  reportType
  advice {
    ...multilingualString
  }
  infoLinks {
    ...infoLink
  }
  validityPeriod {
    ...validityPeriod
  }
  affects {
    __typename
    ... on AffectedStopPlace {
      stopPlace {
        name
      }
      quay {
        name
      }
    }
    ... on AffectedStopPlaceOnServiceJourney {
      stopPlace {
        name
      }
      quay {
        name
      }
    }
    ... on AffectedStopPlaceOnLine {
      stopPlace {
        name
      }
      quay {
        name
      }
    }
  }
}

fragment multilingualString on MultilingualString {
  language
  value
}

fragment infoLink on infoLink {
  uri
  label
}

fragment validityPeriod on ValidityPeriod {
  startTime
  endTime
}
